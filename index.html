<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6b63">
<title>ประเมิน ADL · ศูนย์ดูแลผู้สูงอายุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2a31;--muted:#5a6b73;--paper:#edf3f1;--card:#fff;--line:#d5e0dd;
  --teal:#0d6b63;--teal-d:#094f49;--teal-t:#dcefeb;
  --social:#2f9e5f;--social-t:#e2f4ea;--social-d:#1b6b3f;
  --home:#e2a11a;--home-t:#fcf0d0;--home-d:#7d5300;
  --bed:#d24a4a;--bed-t:#fbe2e0;--bed-d:#992b2b;
  --none:#c4cfcc;--none-t:#eef2f1;
  --r:14px;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --disp:'Mitr','IBM Plex Sans Thai',system-ui,sans-serif;
}
[data-g=social]{--gc:var(--social);--gt:var(--social-t);--gd:var(--social-d)}
[data-g=home]{--gc:var(--home);--gt:var(--home-t);--gd:var(--home-d)}
[data-g=bed]{--gc:var(--bed);--gt:var(--bed-t);--gd:var(--bed-d)}
[data-g=none]{--gc:var(--none);--gt:var(--none-t);--gd:var(--muted)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--font)}
body.lock{overflow:hidden}
#app{max-width:600px;margin:0 auto;min-height:100dvh;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:500;line-height:1.3}
h1{font-size:22px}h2{font-size:18px;margin:24px 0 10px}h3{font-size:16px}
p{margin:0}
a{color:inherit;text-decoration:none}
.mut{color:var(--muted);font-size:14px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 12px}
.top>div{flex:1;min-width:0}
.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--ink);cursor:pointer;flex:none;box-shadow:0 0 0 1px var(--line) inset}
.icon svg{width:22px;height:22px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--teal);color:#fff;font:500 16px var(--font);cursor:pointer;text-align:center}
.btn:disabled{background:#a9bbb8;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--teal-d);box-shadow:0 0 0 1.5px var(--teal) inset}
.btn.danger{background:var(--bed)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.block{width:100%}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:16px var(--font);color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px}
.check input{width:22px;height:22px;accent-color:var(--teal);flex:none}
.err{color:var(--bed-d);font-size:14px;min-height:20px;margin:4px 0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font:500 15px var(--font);color:var(--ink);cursor:pointer}
.chip b{font-weight:600;color:var(--muted);margin-left:2px}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip[aria-pressed=true] b{color:#d6efe9}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 0 0 1px var(--line) inset}
.card+.card{margin-top:12px}
.overview .seg{margin:12px 0 10px}
.seg{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--none-t);gap:2px}
.seg i{display:block;min-width:0}
.seg i[data-g]{background:var(--gc)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.legend li{display:flex;align-items:center;gap:6px}
.legend li i{width:10px;height:10px;border-radius:50%;background:var(--gc)}
.legend b{font-weight:600}
.ov-n{font-size:14px;color:var(--muted)}
.ov-n b{font:500 22px var(--disp);color:var(--ink);margin-right:4px}
.alert{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--home-t);color:var(--home-d);font-size:14px;font-weight:500}
.banner{margin:0 0 10px;padding:8px 12px;border-radius:10px;background:var(--teal-t);color:var(--teal-d);font-size:14px}

/* building card */
.bcard{display:block;padding:14px 16px;background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line) inset;margin-bottom:10px}
.bcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bcard h3{font-size:17px}
.bcard .seg{margin:10px 0 8px;height:10px}
.bcard .mut b{color:var(--ink)}

/* patient card — แถบสีซ้ายคือสัญญาณของกลุ่ม */
.pcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--card);border-radius:var(--r);padding:12px 12px 12px 16px;margin-bottom:10px;position:relative;box-shadow:0 0 0 1px var(--line) inset;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gc)}
.pcard .pname{font-weight:600;font-size:17px;line-height:1.35}
.pcard .pscore{text-align:right;line-height:1.2}
.pcard .pscore b{font:500 26px var(--disp);color:var(--ink)}
.pcard .pscore span{font-size:13px;color:var(--muted)}
.pcard .pscore em{display:block;font-style:normal;font-size:13px;font-weight:600;color:var(--gd)}
.pcard .pact{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flag{display:inline-block;font-size:13px;padding:1px 9px;border-radius:10px;background:var(--none-t);color:var(--muted);font-weight:500}
.flag.warn{background:var(--home-t);color:var(--home-d)}
.flag.bad{background:var(--bed-t);color:var(--bed-d)}
.flag.good{background:var(--social-t);color:var(--social-d)}
.search{margin:2px 0 12px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* patient page */
.hero{display:flex;gap:16px;align-items:center;background:var(--gt);box-shadow:none}
.hero .ht h2{margin:0 0 2px;color:var(--gd);font-size:22px}
.ring{flex:none}
.rt{fill:none;stroke:#fff;stroke-width:10}
.rf{fill:none;stroke:var(--gc);stroke-width:10;stroke-linecap:round}
.rn{font:500 30px var(--disp);fill:var(--ink)}
.rs{font:12px var(--font);fill:var(--muted)}
.plan{margin:8px 0 0;padding-left:20px}
.plan li{margin:4px 0}
.ibar{display:grid;grid-template-columns:1fr 64px 34px;gap:8px;align-items:center;padding:5px 0;font-size:15px}
.ibar .tr{height:8px;border-radius:4px;background:var(--none-t);overflow:hidden}
.ibar .tr i{display:block;height:100%;border-radius:4px}
.ibar span:last-child{text-align:right;font-weight:600}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.hrow:first-child{border-top:0}
.hrow .sc{font:500 20px var(--disp);grid-row:span 2}
.hrow .note{grid-column:2/-1;font-size:14px;color:var(--muted)}
.trend{width:100%;height:auto;display:block}
.trend text{font:11px var(--font);fill:var(--muted)}

/* assessment form */
.notice{padding:10px 14px;border-radius:12px;background:var(--teal-t);color:var(--teal-d);font-size:15px;font-weight:500;margin-bottom:6px}
.sec{margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
.sec small{color:var(--muted);font-size:14px}
.item{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 0 0 1px var(--line) inset;border:0;min-width:0}
.item legend{padding:0;font-weight:600;font-size:17px;float:left;width:100%;margin-bottom:8px}
.item legend small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.item .hint{clear:both;font-size:14px;color:var(--home-d);background:var(--home-t);padding:4px 10px;border-radius:8px;margin-bottom:8px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);margin-top:8px;cursor:pointer;min-height:52px;clear:both}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .sc{flex:none;width:32px;height:32px;border-radius:50%;background:var(--none-t);display:grid;place-items:center;font:500 16px var(--disp)}
.opt .tx{flex:1;padding-top:3px;line-height:1.45}
.opt small{display:inline-block;margin-left:8px;font-size:12px;padding:0 8px;border-radius:9px;background:var(--none-t);color:var(--muted);font-weight:500}
.opt.sel{border-color:var(--teal);background:var(--teal-t)}
.opt.sel .sc{background:var(--teal);color:#fff}
.opt:focus-within{outline:3px solid var(--teal);outline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;box-shadow:0 -1px 0 var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock-in{max-width:600px;margin:0 auto;display:flex;gap:12px;align-items:center}
.dock.sig{border-top:6px solid var(--gc)}
.dock .dk-l{flex:1;min-width:0;line-height:1.25}
.dock .dk-score b{font:500 28px var(--disp)}
.dock .dk-score span{color:var(--muted);font-size:14px}
.dock .dk-g{font-size:14px;font-weight:600;color:var(--gd)}
.dock .btn{flex:1}
.dock.single .btn{width:100%}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,35,40,.5);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:92dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));z-index:31}
.sheet h2{margin:0 0 14px}
.sheet .acts{display:flex;gap:10px;margin-top:8px}
.sheet .acts .btn{flex:1}
.menu{display:grid;gap:8px}
.menu .btn{justify-content:flex-start}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.bad{background:var(--bed-d)}

/* admin */
.tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
.tabs a{flex:none;padding:8px 14px;border-radius:20px;font-weight:500;background:#fff;box-shadow:0 0 0 1.5px var(--line) inset}
.tabs a[aria-current=page]{background:var(--teal);color:#fff;box-shadow:none}
.lrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line) inset;margin-bottom:8px;width:100%;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lrow .mut{display:block}
.login{padding-top:12vh}
.login h1{font-size:28px;margin-bottom:4px}
.login .card{margin-top:22px}

.rep-f{display:flex;gap:8px;margin-bottom:12px}.rep-f select{flex:1}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi div{background:var(--none-t);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font:500 22px var(--disp);line-height:1.3}.kpi span{font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:64px 1fr 30px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.mrow .seg{height:12px}.mrow span:last-child{text-align:right;color:var(--muted)}
.frow{display:block;padding:10px 0;border-top:1px solid var(--line)}.frow:first-child{border-top:0}
.frow .flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.hrow .pb{grid-column:3;grid-row:1}
.menu .btn{justify-content:center}

/* ----- เอกสารพิมพ์ ----- */
#printarea{display:none}
.pd{font:12pt/1.5 var(--font);color:#000}
.pd h1{font:500 16pt/1.4 var(--disp);text-align:center;margin:2px 0 8px}
.pd h2{font-size:14pt;margin:14px 0 6px}.pd h3{font:500 12.5pt var(--disp);margin:14px 0 4px}
.pd .org{text-align:center;font-size:11pt;margin:0}
.pd table{width:100%;border-collapse:collapse;margin:6px 0}
.pd th,.pd td{border:1px solid #444;padding:3px 8px;vertical-align:top;font-size:10.5pt}
.pd th{background:#e9e9e9;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd tr{page-break-inside:avoid}
.pd .kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin:8px 0}
.pd .res{border:2px solid #000;padding:8px 14px;margin:10px 0;display:flex;gap:16px;align-items:center;page-break-inside:avoid}
.pd .res .big{font:500 30pt/1 var(--disp)}.pd .res .big small{font-size:12pt}
.pd ul{margin:2px 0 8px;padding-left:22px}.pd p{margin:4px 0}
.pd .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:center;margin-top:34px;page-break-inside:avoid;font-size:10.5pt}
.pd .sig div{border-top:1px solid #000;padding-top:4px;margin-top:38px}
.pd .pfoot{margin-top:18px;font-size:9pt;color:#444;text-align:center}
.pd .pbreak{page-break-after:always}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important}
  body.lock{overflow:visible}
  #app,#modal,#toast{display:none!important}
  #printarea{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="printarea" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>ต้องเปิดใช้งาน JavaScript</noscript>

<script>
'use strict';
/* ===================== ตั้งค่า ===================== */
const CONFIG = {
  API_URL: '',          // ← วาง URL /exec ของ Apps Script ที่นี่ (ถ้าเว้นว่าง = โหมดทดลอง ข้อมูลเก็บในเครื่องนี้)
  REASSESS_DAYS: 30     // ครบกำหนดประเมินซ้ำเมื่อเกินกี่วัน
};

/* ===================== ข้อมูลแบบประเมิน (Barthel ADL Index, รวม 20) ===================== */
const SECTIONS = [
  {id:'self', th:'การดูแลตนเอง', en:'Self Care'},
  {id:'mob',  th:'การเคลื่อนไหว', en:'Mobility'},
  {id:'exc',  th:'การขับถ่าย', en:'Excretion'}
];
const ITEMS = [
  {k:'feeding', s:'self', th:'การกินอาหาร', en:'Feeding', o:[
    [0,'ไม่สามารถตักอาหารเข้าปากเองได้ ต้องมีคนป้อน'],
    [1,'ตักอาหารเองได้ แต่ต้องมีคนช่วยบางส่วน เช่น หั่นหรือเตรียมอาหารให้'],
    [2,'ตักอาหารกินได้เองตามปกติ']]},
  {k:'grooming', s:'self', th:'ล้างหน้า แปรงฟัน หวีผม', en:'Grooming', o:[
    [0,'ต้องมีคนช่วย'],
    [1,'ทำได้เอง (ล้างหน้า แปรงฟัน หวีผม)']]},
  {k:'dressing', s:'self', th:'การสวมใส่เสื้อผ้า', en:'Dressing', o:[
    [0,'ต้องมีคนสวมใส่ให้ทั้งหมด'],
    [1,'ช่วยตัวเองได้ประมาณครึ่งหนึ่ง'],
    [2,'ทำได้เอง (ติดกระดุม รูดซิป ใส่รองเท้า)']]},
  {k:'bathing', s:'self', th:'การอาบน้ำ', en:'Bathing', o:[
    [0,'ต้องมีคนช่วย'],
    [1,'อาบน้ำถูตัวได้เอง']]},
  {k:'transfer', s:'mob', th:'การลุกนั่งจากที่นอน', en:'Transfer', o:[
    [0,'ไม่สามารถนั่งทรงตัวได้ หรือต้องใช้คน 2 คนช่วยยก'],
    [1,'ต้องมีคนช่วยพยุงมาก (1–2 คน) จึงจะนั่งได้'],
    [2,'ต้องมีคนช่วยเล็กน้อย หรือคอยบอก/ดูความปลอดภัย'],
    [3,'ลุกนั่งเองได้อย่างปลอดภัย']]},
  {k:'mobility', s:'mob', th:'การเดินภายในบ้าน', en:'Mobility', hint:'ต้องเดินได้ 45 เมตร จึงจะได้คะแนนเต็ม', o:[
    [0,'เคลื่อนที่ไม่ได้ หรือเดิน/เข็นรถเข็นเองไม่ถึง 45 เมตร'],
    [1,'ใช้รถเข็นเองได้ (รวมการเลี้ยว) เกิน 45 เมตร'],
    [2,'เดินได้เกิน 45 เมตร โดยต้องมีคนช่วยพยุงหรือคอยดูแล'],
    [3,'เดินได้เอง เกิน 45 เมตร (ใช้ไม้เท้า/walker ได้)']]},
  {k:'stairs', s:'mob', th:'การขึ้นลงบันได 1 ชั้น', en:'Stairs', o:[
    [0,'ทำไม่ได้'],
    [1,'ต้องมีคนช่วยพยุงหรือคอยดู'],
    [2,'ขึ้นลงได้เองอย่างปลอดภัย']]},
  {k:'toilet', s:'exc', th:'การใช้ห้องน้ำ / ส้วม', en:'Toilet Use', o:[
    [0,'ช่วยตัวเองไม่ได้'],
    [1,'ทำได้บ้าง ต้องมีคนช่วยบางส่วน (ทรงตัว ถอดเสื้อผ้า ทำความสะอาด)'],
    [2,'ช่วยตัวเองได้ดี']]},
  {k:'bowel', s:'exc', th:'การกลั้นอุจจาระ', en:'Bowel', o:[
    [0,'กลั้นไม่ได้ หรือต้องสวนอุจจาระ'],
    [1,'กลั้นไม่ได้เป็นบางครั้ง (ไม่เกิน 1 ครั้ง/สัปดาห์)'],
    [2,'กลั้นได้ปกติ ไม่ราด']]},
  {k:'bladder', s:'exc', th:'การกลั้นปัสสาวะ', en:'Bladder', o:[
    [0,'กลั้นไม่ได้ หรือใส่สายสวนและจัดการเองไม่ได้'],
    [1,'กลั้นไม่ได้เป็นบางครั้ง (ไม่เกิน 1 ครั้ง/วัน)'],
    [2,'กลั้นได้ปกติ ไม่ซึม']]}
];
const MAXS = Object.fromEntries(ITEMS.map(i => [i.k, Math.max(...i.o.map(o => o[0]))]));
const GROUPS = {
  social:{label:'ติดสังคม', sub:'ช่วยเหลือตัวเองได้ดี', range:'12–20', plan:[
    'ส่งเสริมสุขภาพ ให้ทำกิจกรรมและเข้าร่วมกิจกรรมกับผู้อื่น','คงความสามารถเดิมไว้ และประเมินซ้ำตามกำหนด']},
  home:{label:'ติดบ้าน', sub:'ต้องการความช่วยเหลือบ้าง', range:'5–11', plan:[
    'ระวังการหกล้ม (Fall prevention)','กระตุ้นให้ทำเองเท่าที่ทำได้ (Encourage self-care)','จัดสิ่งแวดล้อมให้ปลอดภัย']},
  bed:{label:'ติดเตียง', sub:'ช่วยตัวเองไม่ได้เลย', range:'0–4', plan:[

};
const RANK = {bed:0, home:1, social:2};
const groupOf = t => t >= 12 ? 'social' : t >= 5 ? 'home' : 'bed';
const FALLS = [
  {id:'sedative', t:'ใช้ยาที่ทำให้ง่วงซึม (เช่น ยานอนหลับ)'},
  {id:'env',      t:'พื้นลื่น หรือพื้นต่างระดับในพื้นที่ที่ใช้'},
  {id:'balance',  t:'ทรงตัวไม่ดี'},
  {id:'urgency',  t:'กลั้นปัสสาวะไม่อยู่ ต้องรีบเข้าห้องน้ำ'}
];

/* ===================== สถานะและ util ===================== */
const S = {token:null,user:null,branches:[],buildings:[],patients:[],latest:{},branchId:null,filter:'all',q:'',adminBranch:'all',adminQ:'',rep:{branch:'all',days:90}};
let A = null;          // ฟอร์มประเมินที่กำลังกรอก
const H = {}; const R = {assess:null, rep:null};          // cache ประวัติ
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Bangkok'});
const dayNum = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d) / 864e5; };
const daysSince = s => Math.round(dayNum(today()) - dayNum(s));
const fmtDate = s => { if (!s) return '-'; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}); };
const ageOf = p => p.birthYear ? new Date().getFullYear() - Number(p.birthYear) : null;
const branchOf = id => S.branches.find(b => b.id === id);
const bShort = id => { const b = branchOf(id); return b ? (b.shortName || b.name) : ''; };
const bldOf = id => S.buildings.find(b => b.id === id);
const isAdmin = () => S.user && S.user.role === 'admin';
const activePatients = () => S.patients.filter(p => p.status !== 'discharged');
const ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'
};
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', 3200);
}

/* ===================== API (Apps Script) + โหมดทดลอง ===================== */
async function api(action, payload = {}) {
  if (!CONFIG.API_URL) return Demo.call(action, payload);
  const res = await fetch(CONFIG.API_URL, {method:'POST', body: JSON.stringify({action, token:S.token, ...payload})}); // ไม่ใส่ header เพื่อเลี่ยง CORS preflight
  const j = await res.json();
  if (!j.ok) { if (j.error === 'AUTH') { logout(); throw new Error('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่'); } throw new Error(j.error); }
  return j.data;
}

/* ===================== การคำนวณสรุป ===================== */
function stats(list) {
  const s = {social:0, home:0, bed:0, none:0, overdue:0, n:list.length};
  list.forEach(p => {
    const l = S.latest[p.id]?.last;
    if (!l) { s.none++; return; }
    s[l.group]++;
    if (daysSince(l.date) > CONFIG.REASSESS_DAYS) s.overdue++;
  });
  return s;
}
function segBar(s) {
  const n = s.n || 1;
  return `<div class="seg" role="img" aria-label="ติดสังคม ${s.social} ติดบ้าน ${s.home} ติดเตียง ${s.bed} ยังไม่ประเมิน ${s.none}">` +
    ['social','home','bed','none'].map(g => s[g] ? `<i data-g="${g}" style="flex:${s[g]/n}"></i>` : '').join('') + '</div>';
}
function legend(s) {
  return '<ul class="legend">' + ['social','home','bed','none'].map(g =>
    `<li data-g="${g}"><i></i>${g === 'none' ? 'ยังไม่ประเมิน' : GROUPS[g].label} <b>${s[g]}</b></li>`).join('') + '</ul>';
}

function matchFilter(p, f) {
  const l = S.latest[p.id]?.last;
  if (f === 'all') return true;
  if (f === 'none') return !l;
  if (f === 'due') return !!l && daysSince(l.date) > CONFIG.REASSESS_DAYS;
  return !!l && l.group === f;
}
function flagsOf(p) {
  const e = S.latest[p.id], l = e?.last, out = [];
  if (!l) return '<span class="flag">ยังไม่เคยประเมิน</span>';
  const d = daysSince(l.date);
  out.push(`<span class="flag${d > CONFIG.REASSESS_DAYS ? ' warn' : ''}">ประเมินล่าสุด ${fmtDate(l.date)}</span>`);
  if (e.prev) {
    if (RANK[l.group] < RANK[e.prev.group]) out.push('<span class="flag bad">ระดับลดลงจากครั้งก่อน</span>');
    else if (RANK[l.group] > RANK[e.prev.group]) out.push('<span class="flag good">ระดับดีขึ้น</span>');
  }
  if (l.fallRisks?.length) out.push(`<span class="flag warn">เสี่ยงหกล้ม ${l.fallRisks.length} ปัจจัย</span>`);
  return out.join('');
}
function plist(bid) {
  const q = S.q.trim().toLowerCase();
  const list = activePatients().filter(p => p.buildingId === bid && matchFilter(p, S.filter) &&
    (!q || [p.name, p.nickname, p.room, p.hn].some(x => String(x || '').toLowerCase().includes(q))))
    .sort((a, b) => String(a.room).localeCompare(String(b.room), 'th', {numeric:true}) || a.name.localeCompare(b.name, 'th'));
  if (!list.length) return '<p class="empty">ไม่พบผู้รับบริการตามเงื่อนไขนี้</p>';
  return list.map(p => {
    const l = S.latest[p.id]?.last, a = ageOf(p);
    return `<article class="pcard" data-g="${l ? l.group : 'none'}">
      <a href="#/p/${esc(p.id)}"><div class="pname">${esc(p.name)}${p.nickname ? ` <span class="mut">(${esc(p.nickname)})</span>` : ''}</div>
        <div class="mut">ห้อง ${esc(p.room || '-')}${a ? ` · ${a} ปี` : ''}</div></a>
      <div class="pscore">${l ? `<b>${l.total}</b><span>/20</span><em>${GROUPS[l.group].label}</em>` : '<span>—</span>'}</div>
      <div class="pact">${flagsOf(p)}<span style="flex:1"></span><a class="btn sm" href="#/a/${esc(p.id)}">ประเมิน</a></div></article>`;
  }).join('');
}

function ring(total) {
  const r = 42, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 100 100" width="104" height="104" role="img" aria-label="คะแนน ${total} จาก 20">
  <circle cx="50" cy="50" r="${r}" class="rt"/><circle cx="50" cy="50" r="${r}" class="rf" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - total / 20)).toFixed(1)}" transform="rotate(-90 50 50)"/>
  <text x="50" y="54" text-anchor="middle" class="rn">${total}</text><text x="50" y="70" text-anchor="middle" class="rs">จาก 20</text></svg>`;
}

      }).join('')}</section>`;

  <div class="dock single"><div class="dock-in">${l ? `<button class="btn ghost" data-act="printLast" data-id="${esc(id)}">พิมพ์ใบประเมิน</button>` : ''}<a class="btn" href="#/a/${esc(id)}">${l ? 'ประเมินใหม่' : 'ประเมินครั้งแรก'}</a></div></div>`;
}
function trendSvg(list) {
  const pts = list.slice(0, 12).reverse(), n = pts.length;
  const L = 26, R = 10, T = 8, B = 22, W = 320, Hh = 150, iw = W - L - R, ih = Hh - T - B;
  const y = v => T + (1 - v / 20) * ih, x = i => n === 1 ? L + iw / 2 : L + i * iw / (n - 1);
  const band = (a, b, c) => `<rect x="${L}" y="${y(b)}" width="${iw}" height="${y(a) - y(b)}" style="fill:var(--${c}-t)"/>`;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.total).toFixed(1)}`).join(' ');
  return `<svg class="trend" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="กราฟคะแนน ADL ตามเวลา">
    ${band(0, 4.5, 'bed')}${band(4.5, 11.5, 'home')}${band(11.5, 20, 'social')}
    ${[0,5,12,20].map(v => `<text x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}
    ${n > 1 ? `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>` : ''}
    ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.total).toFixed(1)}" r="5" style="fill:var(--${p.group});stroke:#fff;stroke-width:2"/>`).join('')}
    <text x="${L}" y="${Hh - 5}">${fmtDate(pts[0].date)}</text>${n > 1 ? `<text x="${W - R}" y="${Hh - 5}" text-anchor="end">${fmtDate(pts[n - 1].date)}</text>` : ''}</svg>`;
}
function histHtml(pid) {
  const list = H[pid] || [];
  if (!list.length) return '';
  return `<section class="card" style="margin-top:12px"><h3 style="margin-bottom:8px">แนวโน้มคะแนน</h3>${trendSvg(list)}</section>
  <section class="card"><h3>ประวัติการประเมิน</h3>${list.map(a =>
    `<div class="hrow" data-g="${a.group}"><span class="sc">${a.total}</span><span><b style="color:var(--gd)">${GROUPS[a.group].label}</b> · ${fmtDate(a.date)}<span class="mut" style="display:block">${esc(a.assessorName)}</span></span><button class="btn ghost sm pb" data-act="printA" data-pid="${esc(a.patientId)}" data-aid="${esc(a.id)}">พิมพ์</button>${a.note ? `<span class="note">${esc(a.note)}</span>` : ''}</div>`).join('')}</section>`;
}
async function loadHistory(pid) {
  if (H[pid]) { const b = $('#histbox'); if (b) b.innerHTML = histHtml(pid); }
  try { H[pid] = await api('history', {patientId: pid}); } catch (e) { toast(e.message, true); return; }
  const box = $('#histbox'); if (box && location.hash === '#/p/' + pid) box.innerHTML = histHtml(pid);
}

function assessView(pid) {
  const p = S.patients.find(x => x.id === pid); if (!p) return notFound();
  if (!A || A.pid !== pid) A = {pid, scores:{}, falls:[], note:'', date:today()};
  const prev = S.latest[pid]?.last;
  const sect = SECTIONS.map(sc => `<div class="sec"><h2 style="margin:0">${sc.th}</h2><small>${sc.en}</small></div>` +
    ITEMS.filter(i => i.s === sc.id).map(it => `<fieldset class="item"><legend>${esc(it.th)}<small>${it.en}</small></legend>
      ${it.hint ? `<p class="hint">${esc(it.hint)}</p>` : ''}
      ${it.o.map(([v, t]) => {
        const checked = A.scores[it.k] === v, was = prev && prev.scores[it.k] === v;
        return `<label class="opt${checked ? ' sel' : ''}"><input type="radio" name="${it.k}" value="${v}"${checked ? ' checked' : ''}><span class="sc">${v}</span><span class="tx">${esc(t)}${was ? '<small>ครั้งก่อน</small>' : ''}</span></label>`;
      }).join('')}</fieldset>`).join('')).join('');
  return `${backbar('#/p/' + pid, 'ประเมิน ADL', p.name)}
  <p class="notice">ประเมินสิ่งที่ผู้รับบริการ “ทำได้จริง” ใน 24–48 ชั่วโมงที่ผ่านมา ไม่ใช่สิ่งที่ “น่าจะทำได้”</p>
  <label class="field" style="margin-top:12px"><span>วันที่ประเมิน</span><input type="date" id="adate" value="${A.date}" max="${today()}"></label>
  ${sect}
  <div class="sec"><h2 style="margin:0">ปัจจัยเสี่ยงหกล้ม</h2><small>ติ๊กที่พบ (ไม่นับเป็นคะแนน)</small></div>

async function submitForm(form) {
  const f = Object.fromEntries(new FormData(form)), kind = form.dataset.form, err = $('#lerr') || $('#ferr');
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try {
    if (kind === 'login') {
      const d = await api('login', {username:f.username, pin:f.pin});
      S.token = d.token; localStorage.setItem('adl_token', d.token); localStorage.setItem('adl_user', f.username.trim().toLowerCase());
      await loadAll(); location.hash = '#/'; render();
      if (S.user.mustChangePin) pinForm(true);
    } else if (kind === 'patient') {
      const by = Number(f.birthBE); const birthYear = by ? (by > 2400 ? by - 543 : by) : '';
      await api('savePatient', {...f, birthYear}); await loadAll(); closeModal(); render(true); toast('บันทึกแล้ว');
    } else if (kind === 'building') {
      await api('saveBuilding', {id:f.id, branchId:f.branchId, name:f.name, active: f.id ? !!f.active : true}); await loadAll(); closeModal(); render(true); toast('บันทึกแล้ว');
    } else if (kind === 'staff') {
      const br = [...form.querySelectorAll('[name=br]:checked')].map(x => x.value).join(',');
      await api('saveStaff', {username:f.username, name:f.name, role:f.role, branchIds:br, pin:f.pin, active:!!f.active});
      closeModal(); toast('บันทึกแล้ว'); loadStaff();
    } else if (kind === 'pin') {
      await api('changePin', {oldPin:f.oldPin, newPin:f.newPin}); S.user.mustChangePin = false; closeModal(); toast('เปลี่ยน PIN แล้ว');
    }
  } catch (e) { if (err) err.textContent = e.message; if (btn) btn.disabled = false; }
}

function toCsv(rows) {
  return '\ufeff' + rows.map(r => r.map(c => { c = String(c ?? ''); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\r\n');
}
async function exportCsv() {
  try {
    const rows = await api('exportAll');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toCsv(rows)], {type:'text/csv;charset=utf-8'}));
    a.download = `adl-${today()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast(e.message, true); }
}

async function printAssessment(pid, aid) {

const avgOf = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(1) : '-';
function computeReport() {
  const br = S.rep.branch, pts = activePatients().filter(p => br === 'all' || p.branchId === br), st = stats(pts);
  const lastOf = p => S.latest[p.id]?.last;
  const blds = S.buildings.filter(b => b.active !== 'FALSE' && (br === 'all' || b.branchId === br)).map(b => {
    const bp = pts.filter(p => p.buildingId === b.id);
    return {b, s: stats(bp), avg: avgOf(bp.map(p => lastOf(p)?.total).filter(v => v != null))};
  });
  const falls = {}; FALLS.forEach(f => falls[f.id] = 0);
  const follow = [];
  pts.forEach(p => {
    const e = S.latest[p.id], l = e?.last, why = [];
    if (!l) why.push(['ยังไม่เคยประเมิน', '']);
    else {
      const d = daysSince(l.date);
      if (RANK[l.group] < RANK[e.prev ? e.prev.group : l.group]) why.push(['ระดับลดลงจากครั้งก่อน', 'bad']);
      if (d > CONFIG.REASSESS_DAYS) why.push([`เกินกำหนดประเมินซ้ำ (${d} วัน)`, 'warn']);
      if (l.fallRisks.length >= 2) why.push([`เสี่ยงหกล้ม ${l.fallRisks.length} ปัจจัย`, 'warn']);
      l.fallRisks.forEach(f => { if (f in falls) falls[f]++; });
    }
    if (why.length) follow.push({p, l, why});
  });
  const sev = x => x.why.some(w => w[1] === 'bad') ? 1 : 0;
  follow.sort((a, b) => sev(b) - sev(a) || b.why.length - a.why.length);
  const ids = new Set(pts.map(p => p.id)), all = (R.assess || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const cut = dayNum(today()) - S.rep.days, staff = {}, byP = {};
  all.forEach(a => { (byP[a.patientId] = byP[a.patientId] || []).push(a); if (ids.has(a.patientId) && dayNum(a.date) >= cut) staff[a.assessorName] = (staff[a.assessorName] || 0) + 1; });
  const now = new Date(today() + 'T00:00:00'), months = [];
  for (let i = 5; i >= 0; i--) {
    const end = i === 0 ? today() : new Date(now.getFullYear(), now.getMonth() - i + 1, 0).toLocaleDateString('sv-SE');
    const s = {social:0, home:0, bed:0, none:0, n:0};
    pts.forEach(p => { let m = null; for (const a of (byP[p.id] || [])) if (a.date <= end) m = a; if (m) { s[m.group]++; s.n++; } });
    months.push({label: new Date(now.getFullYear(), now.getMonth() - i, 1).toLocaleDateString('th-TH', {month:'short', year:'2-digit'}), s});
  }
  return {pts, st, avg: avgOf(pts.map(p => lastOf(p)?.total).filter(v => v != null)), blds, follow, falls, months,
    staff: Object.entries(staff).sort((a, b) => b[1] - a[1])};
}

    const d = {branches:[], buildings:[], patients:[], assess:[], staff:[{username:'admin', name:'ผู้ดูแลระบบ (ทดลอง)', role:'admin', branchIds:'*', active:'TRUE'}, {username:'nurse', name:'พยาบาลนภา (ทดลอง)', role:'staff', branchIds:'b1,b2', active:'TRUE'}]};

        const sc = me.branchIds === '*' ? null : me.branchIds.split(','), ok = b => !sc || sc.includes(b);
        const pts = d.patients.filter(x => ok(x.branchId)), ids = new Set(pts.map(x => x.id));
        return {user:me, branches:d.branches.filter(b => ok(b.id)), buildings:d.buildings.filter(b => ok(b.branchId)), patients:pts, latest:Demo.latest(d.assess.filter(a => ids.has(a.patientId)))};
      }
      case 'history': return d.assess.filter(x => x.patientId === p.patientId).sort((x, y) => (x.date + x.createdAt) < (y.date + y.createdAt) ? 1 : -1);
      case 'saveAssessment': {
        const total = Object.values(p.scores).reduce((x, y) => x + y, 0);
        const rec = {id:'a' + Date.now(), patientId:p.patientId, date:p.date, scores:p.scores, total, group:groupOf(total), fallRisks:p.fallRisks, note:p.note, assessorName:me.name, createdAt:new Date().toISOString()};
        d.assess.push(rec); Demo.save(d); return rec;
      }
      case 'savePatient': {
        const rec = {status:'active', ...p, id:p.id || 'p' + Date.now(), createdAt:''};
        const i = d.patients.findIndex(x => x.id === rec.id); if (i >= 0) d.patients[i] = rec; else d.patients.push(rec);
        Demo.save(d); return rec;
      }
      case 'saveBuilding': {
        if (p.id) { const b = d.buildings.find(x => x.id === p.id); b.name = p.name; b.active = p.active ? 'TRUE' : 'FALSE'; }
        else d.buildings.push({id:'bl' + Date.now(), branchId:p.branchId, name:p.name, active:'TRUE'});
        Demo.save(d); return true;
      }
      case 'listStaff': return d.staff;
      case 'saveStaff': { const i = d.staff.findIndex(x => x.username === p.username); const rec = {username:p.username, name:p.name, role:p.role, branchIds:p.role === 'admin' ? '*' : p.branchIds, active:p.active ? 'TRUE' : 'FALSE'}; if (i >= 0) d.staff[i] = rec; else d.staff.push(rec); Demo.save(d); return true; }
      case 'reportData': return d.assess.map(x => ({patientId:x.patientId, date:x.date, total:x.total, group:x.group, fallRisks:x.fallRisks, assessorName:x.assessorName}));
      case 'changePin': return true;
      case 'exportAll': {
        const keys = Object.keys(MAXS), rows = [['วันที่ประเมิน','สาขา','ตึก','ห้อง','HN','ชื่อ-สกุล', ...ITEMS.map(i => i.th), 'คะแนนรวม','กลุ่ม','หมายเหตุ','ผู้ประเมิน']];
        d.assess.forEach(x => { const pt = d.patients.find(q => q.id === x.patientId); if (!pt) return;
          rows.push([x.date, d.branches.find(b => b.id === pt.branchId)?.shortName, d.buildings.find(b => b.id === pt.buildingId)?.name, pt.room, pt.hn, pt.name, ...ITEMS.map(i => x.scores[i.k]), x.total, GROUPS[x.group].label, x.note, x.assessorName]); });
        return rows;
      }
    }
    throw new Error('unknown action');
  }
};

(async function boot() {
  S.token = localStorage.getItem('adl_token');
  if (S.token) { try { await loadAll(); if (S.user.mustChangePin) pinForm(true); } catch (e) { S.token = null; S.user = null; } }
  render();
})();
</script>
